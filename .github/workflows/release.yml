name: Build, verify, sign, and upload release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose updater metadata should be refreshed
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: sodium, zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Determine release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vN.N.N" >&2
            exit 64
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Require configured updater public key
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
        run: test -n "$UPDATER_PUBLIC_KEY"
      - name: Prepare distribution tree
        run: |
          rsync -a --delete ./ ./dist/ \
            --exclude='dist/' --exclude='docker_dev/' --exclude='.git/' --exclude='.github/' \
            --exclude='/vendor/' --exclude='node_modules/' --exclude='.circleci/' --exclude='tests/' \
            --exclude='phpunit.xml' --exclude='phpcs.xml' --exclude='.editorconfig' --exclude='.env.testing' \
            --exclude='eslint.config.js' --exclude='.gitattributes' --exclude='.gitignore' --exclude='.prettierrc'
      - name: Install production dependencies
        working-directory: dist
        run: composer install --optimize-autoloader --no-dev --no-interaction
      - name: Build frontend
        working-directory: dist
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build
          rm -rf node_modules
      - name: Set release version
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sed -i -e "s/###VERSION_PLACEHOLDER###/$VERSION/g" app/ReleaseInfo.php
      - name: Build immutable release artifacts
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          UPDATER_FROM_VERSIONS: ${{ vars.UPDATER_FROM_VERSIONS }}
          UPDATER_BOOTSTRAP_RELEASE: ${{ vars.UPDATER_BOOTSTRAP_RELEASE }}
          VERSION: ${{ steps.version.outputs.version }}
          SEQUENCE: ${{ github.run_number }}
        run: php updater/tools/build-release.php dist release-assets "$VERSION" "$SEQUENCE" "$UPDATER_PUBLIC_KEY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: release-assets/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: updater_test
          MYSQL_ROOT_PASSWORD: updater-test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pupdater-test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: release-assets
      - name: Verify exact update archive
        run: |
          php updater/tools/verify-release.php release-assets/PortalDots-update-signed.json
          php tests/Updater/artifact-cycle.php release-assets/PortalDots-update-signed.json
      - name: Run standalone updater tests
        env:
          UPDATER_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=updater_test
          UPDATER_MYSQL_USER: root
          UPDATER_MYSQL_PASSWORD: updater-test
        run: |
          php tests/Updater/run.php
          php tests/Updater/http-private-storage.php
      - name: Update and interrupted-restore cycles from every supported release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATER_MYSQL_USER: root
          UPDATER_MYSQL_PASSWORD: updater-test
        run: |
          mkdir -p old-releases
          # PHP source must keep its dollar variables literal.
          # shellcheck disable=SC2016
          php -r '$s=json_decode(file_get_contents("release-assets/PortalDots-update-signed.json"),true,128,JSON_THROW_ON_ERROR); foreach($s["from_versions"] as $v){echo $v,"\n";}' > old-releases/versions.txt
          while IFS= read -r version; do
            mkdir -p "old-releases/$version"
            gh release download "v$version" --repo portaldots/PortalDots --pattern PortalDots.zip --dir "old-releases/$version"
            php tests/Updater/engine-release-cycle.php \
              release-assets/PortalDots-update-signed.json \
              "release-assets/PortalDots-update-${{ github.run_number }}.zip" \
              "old-releases/$version/PortalDots.zip" \
              127.0.0.1 3306 updater_test
          done < old-releases/versions.txt

  sign-and-publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: sodium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: release-assets
      - name: Sign the verified manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
        run: php updater/tools/sign-manifest.php release-assets/PortalDots-update-signed.json release-assets/PortalDots-update-manifest.json
      - name: Create draft release with full and updater-specific assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/PortalDots.zip
          release-assets/PortalDots-update-*.zip
          release-assets/PortalDots-update-manifest.json
          --draft --title "${{ github.ref_name }}" --notes ""
      - name: Upload refreshed updater assets to the existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-assets/PortalDots-update-*.zip
          release-assets/PortalDots-update-manifest.json
          --clobber
