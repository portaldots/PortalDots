<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PortalDots デモ</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f3f6f9; --surface: #fff; --text: #1d2b36; --muted: #5d6f7d; --line: #d7e0e7;
      --accent: #1a73e8; --accent-text: #fff; --accent-soft: #e8f0fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111417; --surface: #1c2126; --text: #e6ebef; --muted: #9aa8b3; --line: #2f3740;
        --accent: #8ab4f8; --accent-text: #0b1b33; --accent-soft: #1d2a3d;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }

    #loading {
      position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 20px;
      background: var(--bg); transition: opacity .3s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-error { display: none; max-width: 28em; padding: 0 16px; text-align: center; color: var(--muted); }
    #loading.failed .spinner { display: none; }
    #loading.failed #loading-error { display: block; }

    dialog {
      width: min(440px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 16px;
      background: var(--surface); color: var(--text); box-shadow: 0 24px 64px rgba(0, 0, 0, .25);
    }
    dialog::backdrop { background: rgba(10, 20, 30, .45); }
    .dialog-body { display: grid; gap: 20px; padding: 28px 24px 24px; }
    .dialog-body h2 { margin: 0; font-size: 20px; }
    .accounts { display: grid; gap: 10px; }
    .account {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
      width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
      background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .account:hover, .account:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
    .account strong { font-size: 16px; }
    .account code { grid-column: 1; font-size: 13px; color: var(--muted); }
    .account .go {
      grid-row: 1 / span 2; grid-column: 2; padding: 6px 14px; border-radius: 999px;
      background: var(--accent); color: var(--accent-text); font-size: 13px; font-weight: 600;
    }
    .notes { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
    .notes li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; }
    .notes svg { width: 18px; height: 18px; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 2; }
    .close {
      justify-self: center; padding: 6px 12px; border: 0; background: none;
      color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline;
    }

    #help {
      position: fixed; right: 16px; bottom: 16px; width: 36px; height: 36px; border: 1px solid var(--line);
      border-radius: 50%; background: var(--surface); color: var(--muted); font: 600 16px/1 system-ui, sans-serif;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15); cursor: pointer; opacity: .75;
    }
    #help:hover, #help:focus-visible { opacity: 1; }
    /* PortalDots shows a 4.5rem bottom tab bar at 1000px and below. */
    @media (max-width: 1000px) {
      #help { bottom: calc(env(safe-area-inset-bottom) + 4.5rem + 12px); }
    }
  </style>
</head>
<body>
  <iframe title="PortalDots" hidden></iframe>

  <div id="loading" role="status">
    <div class="brand">PortalDots</div>
    <div class="spinner" aria-label="起動しています"></div>
    <p id="loading-error"></p>
  </div>

  <button id="help" type="button" aria-label="デモの使い方" hidden>?</button>

  <dialog id="intro" aria-labelledby="intro-title">
    <div class="dialog-body">
      <h2 id="intro-title">PortalDots を試してみましょう</h2>
      <div class="accounts">
        <button class="account" type="button" data-login="admin@example.test">
          <strong>スタッフ</strong>
          <code>admin@example.test / PortalDemo123!</code>
          <span class="go">ログイン</span>
        </button>
        <button class="account" type="button" data-login="user@example.test">
          <strong>参加者</strong>
          <code>user@example.test / PortalDemo123!</code>
          <span class="go">ログイン</span>
        </button>
      </div>
      <ul class="notes">
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <span>データはこのブラウザの中だけに保存され、ほかの人には見えません。</span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span>ページを再読み込みすると、最初の状態に戻ります。</span>
        </li>
      </ul>
      <button class="close" type="button" value="close">自分で入力する</button>
    </div>
  </dialog>

  <script type="module" src="./landing.js"></script>
</body>
</html>
